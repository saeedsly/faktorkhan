name: Build Windows app

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

      - name: Build faktorkhan.exe
        run: >
          pyinstaller --noconfirm --windowed --name faktorkhan
          --collect-submodules faktorkhan run_faktorkhan.py

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: faktorkhan-windows
          path: dist/faktorkhan/
