# ──────────────────────────────────────────────────────────────
#  فاکتورخوان — پیکربندی Apache (WAMP / XAMPP ویندوز)
#  این فایل را در مسیر زیر کپی کنید و Apache را ری‌استارت کنید:
#     C:\wamp64\bin\apache\apache2.4.x\conf\extra\httpd-vhosts.conf
#     (یا در httpd.conf با Include فعال کنید)
# ──────────────────────────────────────────────────────────────

# ۱) ماژول‌های لازم را فعال کنید (در httpd.conf از حالت # خارج شوند)
#    LoadModule proxy_module            modules/mod_proxy.so
#    LoadModule proxy_http_module       modules/mod_proxy_http.so
#    LoadModule headers_module          modules/mod_headers.so
#    LoadModule rewrite_module          modules/mod_rewrite.so

Listen 80

<VirtualHost *:80>
    ServerName faktorkhan.local
    ServerAlias localhost

    # مسیر نصب پروژه (نمونه)
    DocumentRoot "C:/wamp64/www/faktorkhan"

    # فایل‌های استاتیک را مستقیم سرو می‌کنیم
    Alias /assets "C:/wamp64/www/faktorkhan/frontend/assets"
    <Directory "C:/wamp64/www/faktorkhan/frontend/assets">
        Require all granted
        AllowOverride None
        FileETag None
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=604800"
        </IfModule>
    </Directory>

    <Directory "C:/wamp64/www/faktorkhan">
        Require all granted
        Options -Indexes
    </Directory>

    # همه درخواست‌ها به برنامه پایتون روی پورت ۸۰۰۰ منتقل می‌شوند
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 300
    ProxyPass        /  http://127.0.0.1:8000/
    ProxyPassReverse /  http://127.0.0.1:8000/

    <Proxy *>
        Require all granted
    </Proxy>

    # محدودیت حجم بارگذاری (۲۵ مگابایت + حاشیه)
    LimitRequestBody 31457280

    ErrorLog  "logs/faktorkhan-error.log"
    CustomLog "logs/faktorkhan-access.log" common

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options SAMEORIGIN
        Header always set Referrer-Policy no-referrer
    </IfModule>
</VirtualHost>
