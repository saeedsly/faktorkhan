# ══════════════════════════════════════════════════════════════
#  فاکتورخوان — پیکربندی Apache (WAMP / XAMPP ویندوز)
#  اثر: سعید سالاری
#
#  محل نصب:  C:\wamp64\bin\apache\apache2.4.x\conf\extra\httpd-vhosplocal.conf
#            (یا در httpd.conf با Include فعال کنید)
#
#  این فایل دو بخش دارد:
#     ۱) انتشار روی اینترنت با HTTPS  (دامنه واقعی)
#     ۲) اجرا در شبکهٔ محلی بدون دامنه (برای تست)
#  فقط بخشی را که لازم دارید فعال کنید.
# ══════════════════════════════════════════════════════════════

# ── ماژول‌های لازم (در httpd.conf از حالت # خارج شوند) ────────
#    LoadModule proxy_module         modules/mod_proxy.so
#    LoadModule proxy_http_module    modules/mod_proxy_http.so
#    LoadModule headers_module       modules/mod_headers.so
#    LoadModule rewrite_module       modules/mod_rewrite.so
#    LoadModule ssl_module           modules/mod_ssl.so
#    LoadModule socache_shmcb_module modules/mod_socache_shmcb.so

# ──────────────────────────────────────────────────────────────
#  بخش ۱ — انتشار روی اینترنت (HTTP فقط برای ریدایرکت و ACME)
# ──────────────────────────────────────────────────────────────
<VirtualHost *:80>
    ServerName faktorkhan.ir
    ServerAlias www.faktorkhan.ir

    # مسیر اعتبارسنجی SSL (win-acme / Let's Encrypt) باید باز بماند
    <IfModule mod_alias.c>
        Alias /.well-known/acme-challenge "C:/wamp64/www/acme/.well-known/acme-challenge"
        <Directory "C:/wamp64/www/acme/.well-known/acme-challenge">
            Require all granted
        </Directory>
    </IfModule>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    ErrorLog  "logs/faktorkhan-http-error.log"
    CustomLog "logs/faktorkhan-http-access.log" common
</VirtualHost>

# ──────────────────────────────────────────────────────────────
#  بخش ۱-ب — HTTPS (دامنه + گواهی SSL)
# ──────────────────────────────────────────────────────────────
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName faktorkhan.ir
    ServerAlias www.faktorkhan.ir

    # گواهی‌ها را با win-acme بسازید؛ مسیر خروجی معمولاً همین است:
    SSLEngine on
    SSLCertificateFile      "C:/ssl/faktorkhan.ir/certificate.crt"
    SSLCertificateKeyFile   "C:/ssl/faktorkhan.ir/private.key"
    SSLCertificateChainFile "C:/ssl/faktorkhan.ir/ca.crt"
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite          HIGH:!aNULL:!MD5
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    # فایل‌های استاتیک مستقیم سرو می‌شوند (سریع‌تر)
    Alias /assets "C:/wamp64/www/faktorkhan/frontend/assets"
    <Directory "C:/wamp64/www/faktorkhan/frontend/assets">
        Require all granted
        AllowOverride None
        FileETag None
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=604800, immutable"
        </IfModule>
    </Directory>

    # همهٔ درخواست‌ها به برنامهٔ پایتون روی ۱۲۷.۰.۰.۱:۸۰۰۰
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 300
    ProxyPass        /  http://127.0.0.1:8000/ retry=0
    ProxyPassReverse /  http://127.0.0.1:8000/

    # اطلاعات اصلی کاربر به برنامه منتقل شود (برای محدودسازی تلاش ورود)
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"
    # اگر IP واقعی را از CDN می‌گیرید، این خط را فعال کنید:
    # RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    <Proxy *>
        Require all granted
    </Proxy>

    # حداکثر حجم آپلود = MAX_UPLOAD_MB + حاشیه
    LimitRequestBody 31457280

    # ── هدرهای امنیتی (حتماً فعال بمانند) ──
    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "no-referrer"
        Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()"
        Header always unset X-Powered-By
        Header unset Server
        ServerSignature Off
    </IfModule>

    ErrorLog  "logs/faktorkhan-ssl-error.log"
    CustomLog "logs/faktorkhan-ssl-access.log" combined
</VirtualHost>
</IfModule>

