# ──────────────────────────────────────────────────────────────
#  فاکتورخوان — پیکربندی Nginx (پروکسی معکوس + HTTPS)
# ──────────────────────────────────────────────────────────────
upstream faktorkhan_app {
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 30M;

    # اگر گواهی SSL دارید، خط زیر را فعال کنید
    # return 301 https://$host$request_uri;

    access_log /var/log/nginx/faktorkhan.access.log;
    error_log  /var/log/nginx/faktorkhan.error.log;

    location / {
        proxy_pass http://faktorkhan_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location /assets/ {
        proxy_pass http://faktorkhan_app;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
}

